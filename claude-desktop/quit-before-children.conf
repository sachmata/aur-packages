# Applies to the scope Claude Desktop's main process moves itself into at
# startup (app-com.anthropic.Claude-<pid>.scope), installed by the
# claude-desktop package.
#
# When started from GNOME, Claude begins in GNOME's scope
# (app-gnome-com.anthropic.Claude-<pid>.scope, same <pid>). Its main process
# then moves itself into the scope above, leaving the zygotes, GPU process
# and renderers behind in GNOME's scope. At logout, restart and shutdown,
# systemd stops GNOME's scope (it is PartOf=graphical-session.target) and
# kills those child processes, but leaves the main process running. Claude
# sees its GPU process die outside a quit, cannot restart it (the zygotes
# are gone too), counts that as repeated GPU crashes and turns hardware
# acceleration off for the next launch.
#
# Stop the main process's scope together with the graphical session, and
# before GNOME's scope (stop order is the reverse of start order, so After=
# means "stopped before"; %j is the trailing <pid>). The main process gets
# SIGTERM first, quits normally and closes its children, and GNOME's scope
# is only stopped once it has exited.

[Unit]
PartOf=graphical-session.target
After=app-gnome-com.anthropic.Claude-%j.scope

[Scope]
# Room for Claude's quit cleanup (well under a second when idle, longer
# with Claude Code sessions or MCP servers to stop) before SIGKILL
TimeoutStopSec=15s
