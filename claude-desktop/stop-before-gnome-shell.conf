# Applies to the scope GNOME Shell starts Claude Desktop in
# (app-gnome-com.anthropic.Claude-<pid>.scope), installed by the
# claude-desktop package.
#
# At logout, restart or shutdown, systemd stops app scopes and GNOME Shell
# in parallel. Claude then loses the Wayland display while its child
# processes are being killed, fails to restart its GPU process, counts those
# failures as GPU crashes and turns hardware acceleration off for the next
# launch. Stopping the scope before the shell keeps the display available
# until Claude has exited. (Stop order is the reverse of start order, so
# After= means "stopped before".)
#
# The file name must sort after gnome-session's
# app-gnome-.scope.d/override.conf: drop-ins from all matching directories
# are applied in file-name order, and that file sets TimeoutStopSec=5s.

[Unit]
After=org.gnome.Shell@wayland.service org.gnome.Shell@x11.service

[Scope]
# Room for Claude's quit cleanup (well under a second when idle, longer
# with Claude Code sessions or MCP servers to stop) before SIGKILL
TimeoutStopSec=15s
